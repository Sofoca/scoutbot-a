name: Scheduled WBM Scraper Run

on:
  #schedule:
  #  - cron: '*/5 6-19 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scoutbot-${{ github.repository }}
  cancel-in-progress: false

jobs:
  run-scraper:
    # Pinned image: ubuntu-latest moves to Ubuntu 26 and would silently change the
    # preinstalled Chrome/chromedriver and system Python 3.12 used as fallbacks below.
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    # Steps without an id stay out of the steps context, so a transient failure in a
    # download that has a fallback never counts as a failed stage or sends an alert.
    steps:
      - name: Check out repository
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Wait before retrying checkout
        if: ${{ hashFiles('main.py') == '' }}
        run: sleep 30

      - name: Retry checkout
        if: ${{ hashFiles('main.py') == '' }}
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify checkout
        id: checkout
        continue-on-error: true
        run: test -f main.py && git rev-parse --verify HEAD

      - name: Fetch this repository's application history and incident state
        id: history
        if: ${{ !contains(steps.*.outcome, 'failure') }}
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          fetched=false
          for i in {1..3}; do
            if git fetch origin log; then fetched=true; break; fi
            sleep 5
          done
          "$fetched"
          mkdir -p logs
          git show origin/log:logs/flats.log > logs/flats.log
          if git cat-file -e origin/log:logs/state.json 2>/dev/null; then
            git show origin/log:logs/state.json > logs/state.json
          fi

      # No id: a transient download outage (e.g. HTTP 504) must not count as a failed
      # stage. The "uv" step below verifies uv or installs it from PyPI.
      # setup-uv publishes no major tags since v8, so the exact version is pinned.
      - name: Install uv
        if: ${{ !contains(steps.*.outcome, 'failure') }}
        continue-on-error: true
        uses: astral-sh/setup-uv@v10.3.3

      - name: Ensure uv is available (PyPI fallback)
        id: uv
        if: ${{ !contains(steps.*.outcome, 'failure') }}
        continue-on-error: true
        run: |
          if command -v uv >/dev/null 2>&1; then uv --version; exit 0; fi
          echo "::warning::setup-uv could not download uv; installing it from PyPI instead."
          for i in 1 2 3; do
            if pipx install --force uv || python3 -m pip install --user --break-system-packages uv; then
              echo "$HOME/.local/bin" >> "$GITHUB_PATH"
              "$HOME/.local/bin/uv" --version
              exit 0
            fi
            sleep $((10 * i))
          done
          exit 1

      - name: Set up Python
        id: python
        if: ${{ !contains(steps.*.outcome, 'failure') }}
        continue-on-error: true
        run: |
          for i in 1 2 3; do
            if uv python install 3.12; then exit 0; fi
            sleep $((10 * i))
          done
          # Managed Python download unavailable: fall back to a runner-provided 3.12.
          uv python find 3.12

      - name: Install dependencies
        id: dependencies
        if: ${{ !contains(steps.*.outcome, 'failure') }}
        continue-on-error: true
        run: |
          for i in 1 2 3; do
            if uv sync --python 3.12 --locked --all-extras --dev; then exit 0; fi
            sleep $((10 * i))
          done
          exit 1

      # No id: if the Chrome download fails, the "chrome" step falls back to the
      # runner image's preinstalled Chrome and matching chromedriver.
      - name: Download Chrome
        if: ${{ !contains(steps.*.outcome, 'failure') }}
        continue-on-error: true
        uses: browser-actions/setup-chrome@v2
        with:
          install-chromedriver: true

      - name: Select a matching Chrome and chromedriver
        id: chrome
        if: ${{ !contains(steps.*.outcome, 'failure') }}
        continue-on-error: true
        run: |
          major() { [[ "$("$1" --version 2>/dev/null)" =~ ([0-9]+)\. ]] && echo "${BASH_REMATCH[1]}"; }
          pick() {
            [ -x "$1" ] && [ -x "$2" ] || return 1
            local chrome_major driver_major
            chrome_major="$(major "$1")" && driver_major="$(major "$2")" || return 1
            [ "$chrome_major" = "$driver_major" ] || { echo "Version mismatch: $1 ($chrome_major) vs $2 ($driver_major)"; return 1; }
            echo "chrome-path=$1" >> "$GITHUB_OUTPUT"
            echo "chromedriver-path=$2" >> "$GITHUB_OUTPUT"
            echo "Using $1 with $2 (major $chrome_major)"
          }
          if pick "$(command -v chrome || true)" "$(command -v chromedriver || true)"; then exit 0; fi
          echo "::warning::Downloaded Chrome unavailable; using the runner's preinstalled Chrome."
          pick "$(command -v google-chrome || true)" "${CHROMEWEBDRIVER:-/usr/local/share/chromedriver-linux64}/chromedriver"

      - name: Run scraper
        id: scraper
        if: ${{ !contains(steps.*.outcome, 'failure') }}
        continue-on-error: true
        env:
          CHROME_BINARY: ${{ steps.chrome.outputs.chrome-path }}
          USER_CONFIG: ${{ secrets.USER_CONFIG }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "$(dirname "${{ steps.chrome.outputs.chromedriver-path }}")" >> "$GITHUB_PATH"
          export PATH="$(dirname "${{ steps.chrome.outputs.chromedriver-path }}"):$PATH"
          uv run --python 3.12 main.py

      - name: Preserve history and incident state even after a scraper failure
        id: persist
        if: ${{ always() && steps.scraper.outcome != 'skipped' && steps.history.outcome == 'success' }}
        continue-on-error: true
        run: |
          log_worktree="$RUNNER_TEMP/scoutbot-log"
          trap 'git worktree remove --force "$log_worktree" 2>/dev/null || true' EXIT
          for i in {1..3}; do
            if git fetch origin log; then break; fi
            if [ "$i" = 3 ]; then exit 1; fi
            sleep 5
          done
          git worktree add --detach "$log_worktree" origin/log
          mkdir -p "$log_worktree/logs"
          cp logs/flats.log "$log_worktree/logs/flats.log"
          if [ -f logs/state.json ]; then cp logs/state.json "$log_worktree/logs/state.json"; fi
          git -C "$log_worktree" add logs/
          if git -C "$log_worktree" diff --cached --quiet; then exit 0; fi
          git -C "$log_worktree" commit -m "chore(log): preserve applications and incident state"
          for i in {1..3}; do
            if git -C "$log_worktree" push origin HEAD:log; then exit 0; fi
            if [ "$i" = 3 ]; then exit 1; fi
            sleep 5
          done

      - name: Upload logs
        if: ${{ always() && (contains(steps.*.outcome, 'failure') || hashFiles('logs/attention') != '') }}
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: scraper-logs
          path: |
            logs/app.log
            logs/flats.log
            logs/state.json
          retention-days: 7

      - name: Report workflow problems via Telegram, email only as fallback
        if: ${{ always() }}
        env:
          STEP_RESULTS: ${{ toJSON(steps) }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          from pathlib import Path
          steps = json.loads(os.environ['STEP_RESULTS'])
          failures = [name for name, step in steps.items() if step.get('outcome') == 'failure']
          if not failures:
              raise SystemExit(0)
          repo = os.environ['GITHUB_REPOSITORY']
          url = f"https://github.com/{repo}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          message = (f"⚠️ {repo}: workflow needs attention.\nFailed stages: {', '.join(failures)}.\n"
                     f"Applications may be interrupted. Check the failed stage and logs: {url}")
          if 'scraper' in failures and Path('logs/alert.txt').exists():
              message = Path('logs/alert.txt').read_text() + '\n' + message
          if 'persist' in failures:
              message += '\nApplication history could not be saved. Recover scraper-logs before the next run to prevent duplicates.'
          token = os.getenv('TELEGRAM_BOT_TOKEN')
          chat = os.getenv('TELEGRAM_CHAT_ID')
          if token and chat:
              for attempt in range(3):
                  try:
                      request = urllib.request.Request(f'https://api.telegram.org/bot{token}/sendMessage',
                          data=json.dumps({'chat_id': chat, 'text': message[:4000]}).encode(),
                          headers={'Content-Type': 'application/json'})
                      with urllib.request.urlopen(request, timeout=15) as response:
                          if json.load(response).get('ok') is True:
                              print('Failure delivered to Telegram; no email fallback needed.')
                              raise SystemExit(0)
                  except Exception:
                      time.sleep(2 * (attempt + 1))
          raise SystemExit('Telegram delivery unavailable: failing the workflow for GitHub email fallback.')
          PY
